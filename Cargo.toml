[package]
name = "Numstore"
version = "0.1.0"
edition = "2024"

[dependencies]
mio = { version = "1", features = ["os-poll", "net"] }

[build-dependencies]
cc = "1.0"
glob = "0.3.3"
regex = "1.13.1"

[features]
default = ["logging", "asan", "tools", "samples", "docs"]

portable = []
tests = []
logging = []
asan = []
optimize-code = []
coverage = []
tools = []
samples = []
docs = []

unit_tests = []
irwr_tests = []
cgd_tests = []
