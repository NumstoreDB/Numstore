[build-system]
requires = ["scikit-build-core>=0.10", "numpy>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pynumstore"
dynamic = ["version"]
description = "Python bindings for numstore, an embedded ACID database for arrays"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Theo Lincke" }]
dependencies = ["numpy>=1.23"]

[project.urls]
Homepage = "https://github.com/NumstoreDB/Numstore"

[project.optional-dependencies]
test = ["pytest>=7"]

[[tool.dynamic-metadata]]
field = "version"
provider = "scikit_build_core.metadata.regex"
input = "version.txt"
regex = '^v?(?P<value>\S+)'

[tool.scikit-build]
cmake.source-dir = "."
cmake.build-type = "Release"
wheel.packages = ["libs/pynumstore/src/pynumstore"]
install.components = ["python"]
build-dir = "build/wheel/{wheel_tag}"
# Tests live outside the shipped package, so keep them out of the sdist too.
sdist.exclude = ["libs/pynumstore/tests", "build", "docs/pandoc"]
# The extension sources sit in the package directory, so wheel.packages would
# otherwise ship them next to the built .so.
wheel.exclude = ["pynumstore/ns_pynumstore.c", "pynumstore/ns_pynumstore.h"]

[tool.cibuildwheel]
archs = ["auto"]
skip = [
    # NumPy publishes no Windows ARM64 wheels for these Pythons
    "cp39-win_arm64",
    "cp310-win_arm64",
]
test-extras = ["test"]
test-sources = ["libs/pynumstore/tests", "pyproject.toml", "version.txt"]
test-command = "python -m pytest libs/pynumstore/tests"

[tool.pytest.ini_options]
testpaths = ["libs/pynumstore/tests"]
pythonpath = ["libs/pynumstore/tests"]
addopts = ["--import-mode=importlib"]
# Test modules are named after the pynumstore module they cover (database.py,
# query.py, ...), not test_*.py, so collection needs every file in testpaths.
python_files = ["*.py"]
