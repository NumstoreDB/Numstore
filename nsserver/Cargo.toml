[package]
name = "nsserver"
version = "0.1.0"
edition = "2024"

[dependencies]
numstore = { path = "../bindings/rust" }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal"] }
tokio-stream = "0.1"

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[[bin]]
name = "nsserver"
path = "src/main.rs"

[[bin]]
name = "nsclient"
path = "src/bin/nsclient.rs"
