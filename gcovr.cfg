root = .

# gcov on a multi-binary run reports the odd negative hit count; one warning
# per file is enough to notice without drowning the log.
gcov-ignore-parse-errors = negative_hits.warn_once_per_file

############ Not library code
exclude = apps
exclude = samples
exclude = build

############ Generic noise
exclude-noncode-lines = yes
exclude-function-lines = yes

exclude-unreachable-branches = yes
exclude-throw-branches = yes

############ Excluded lines
exclude-lines-by-pattern = \s*(ASSERT\w*|DBG_ASSERT\w*|DEFINE_DBG_ASSERT|UNREACHABLE|UNIMPLEMENTED|crash|panic|_Static_assert)\s*\(.*

############ Excluded branches
exclude-branches-by-pattern = \s*(TEST|TEST_CASE|TEST_DISABLED|TEST_NOOP|TEST_BODY_\w+|TEST_WRAPPER|TEST_MARK|test_\w+|fail_test|FAULT|FAULT_NULL|i_log|i_log_printf|switch)\s*\(.*
