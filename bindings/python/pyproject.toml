[build-system]
requires = ["scikit-build-core>=0.10", "numpy>=1.23"]
build-backend = "scikit_build_core.build"

[project]
name = "pynumstore"
version = "0.1.0"
description = "Python bindings for numstore, an embedded ACID database for arrays"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Theo Lincke" }]
dependencies = ["numpy>=1.23"]

[project.urls]
Homepage = "https://github.com/NumstoreDB/Numstore"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.scikit-build]
cmake.source-dir = "."     # The numstore library dependency
cmake.build-type = "Release"            # gives you NDEBUG
wheel.packages = ["src/pynumstore"]     # pure-Python files, incl. py.typed and .pyi
install.components = ["python"]         # only package the extension, not the C SDK
build-dir = "build/{wheel_tag}"         # reuse the build between runs

[tool.pytest.ini_options]
testpaths = ["tests"]
