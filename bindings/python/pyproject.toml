[build-system]
requires = ["scikit-build-core>=0.10", "numpy>=1.23"]
build-backend = "scikit_build_core.build"

[project]
name = "pynumstore"
version = "0.1.0"
description = "Python bindings for numstore, an embedded ACID database for arrays"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Theo Lincke" }]
dependencies = ["numpy>=1.23"]

[project.urls]
Homepage = "https://github.com/NumstoreDB/Numstore"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.scikit-build]
cmake.source-dir = "."                  # CMakeLists.txt here pulls in the numstore library
cmake.build-type = "Release"            # gives you NDEBUG
wheel.packages = ["src/pynumstore"]     # pure-Python files, incl. py.typed and .pyi
install.components = ["python"]         # only package the extension, not the C SDK
build-dir = "build/{wheel_tag}"         # reuse the build between runs

# _numstore/ is gitignored, and the sdist otherwise follows gitignore -- but it
# is exactly what makes the sdist buildable, so name it explicitly. Run
# scripts/vendor.sh before building an sdist (make sdist does).
sdist.include = ["_numstore/**"]

[tool.cibuildwheel]
# CPython only: the extension is a CPython C-API module.
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = [
    "*-musllinux_*",
    "*_i686",
    "*-win32",
    # numpy publishes win_arm64 wheels for cp311+ only (and only from numpy
    # 2.3.0). On cp39/cp310 pip would build numpy from source on the ARM64
    # runner, where it picks up MinGW gcc and fails inside numpy's own sources.
    "cp39-win_arm64",
    "cp310-win_arm64",
]
test-extras = ["test"]
test-command = "pytest {package}/tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
