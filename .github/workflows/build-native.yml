name: Build And Test
on:
  workflow_call:
    inputs:
      platforms:
        description: Array of platforms, e.g. ["ubuntu-latest", "windows-latest"]
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # The unit_tests target only exists when CMAKE_BUILD_TYPE is Debug, which
      # multi-config generators ignore. Force Ninja (and the matching compiler
      # environment) so Windows gets a single-config build like everyone else.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Use Ninja on Windows
        if: runner.os == 'Windows'
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - name: Build Code
        run: make

      - name: Run Unit Tests
        run: |
          seed=$(( (RANDOM << 15 | RANDOM) % 500000000 + 10 ))
          exe=build/debug/bin/unit_tests
          [ -f "$exe" ] || exe="$exe.exe"
          "$exe" "$seed"

      # Disabled as swarm tests are in development
      - name: Run swarm tests
        if: false
        run: |
          seed=$(( (RANDOM << 15 | RANDOM) % 500000000 + 10 ))
          seqid=$(( (RANDOM << 15 | RANDOM) % 500000000 + 10 ))
          exe=build/debug/bin/ns_simtest
          [ -f "$exe" ] || exe="$exe.exe"
          "$exe" \
            --dbname "swarm_test_${{ matrix.platform }}.db" \
            --duration 10 \
            --seed "$seed" \
            --commit-hash "${{ github.sha }}" \
            --seqid "$seqid"

      - name: Build release package
        run: make release-package

      - name: Compress and upload
        uses: ./.github/actions/compress-and-upload
        with:
          folder: build/release/package
          artifact-name: release-${{ matrix.platform }}
