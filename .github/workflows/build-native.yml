name: Build And Test
on:
  workflow_call:
    inputs:
      platforms:
        description: Array of platforms, e.g. ["ubuntu-latest", "windows-latest"]
        required: true
        type: string
      duration:
        description: Seconds to run ns_simtest for
        required: false
        type: number
        default: 10

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # unit_tests and ns_simtest only exist when CMAKE_BUILD_TYPE is Debug,
      # which multi-config generators ignore. Force Ninja (and the matching
      # compiler environment) so Windows gets a single-config build too.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Use Ninja on Windows
        if: runner.os == 'Windows'
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - name: Build debug
        run: make

      - name: Run unit tests
        run: |
          seed=$(( (RANDOM << 15 | RANDOM) % 500000000 + 10 ))
          echo "::notice title=unit_tests seed::$seed"
          exe=build/debug/bin/unit_tests
          [ -f "$exe" ] || exe="$exe.exe"
          "$exe" "$seed"

      - name: Run simulation test
        run: |
          seed=$(( (RANDOM << 15 | RANDOM) % 500000000 + 10 ))
          seqid=$(( (RANDOM << 15 | RANDOM) % 500000000 + 10 ))
          echo "::notice title=ns_simtest seed::seed=$seed seqid=$seqid"
          exe=build/debug/bin/ns_simtest
          [ -f "$exe" ] || exe="$exe.exe"
          "$exe" \
            --dbname "simtest_${{ matrix.platform }}.db" \
            --duration ${{ inputs.duration }} \
            --seed "$seed" \
            --commit-hash "${{ github.sha }}" \
            --seqid "$seqid"

      - name: Build release package
        run: make release-package

      - name: Compress and upload
        uses: ./.github/actions/compress-and-upload
        with:
          folder: build/release/package
          artifact-name: release-${{ matrix.platform }}
