name: Format

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install formatters
        run: |
          pip install --upgrade \
            'clang-format==23.1.1' \
            'gersemi==0.29.2' \
            'ruff==0.16.10'

      - name: Report toolchain
        run: |
          clang-format --version
          gersemi --version
          ruff --version
          make --version | head -1

      - name: Check formatting
        run: make ci-format

      - name: Check copyright headers
        run: make ci-copyright
