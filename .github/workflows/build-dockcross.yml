name: Build And Test (Qemu)
on:
  workflow_call:
    inputs:
      builds:
        description: >
          JSON array of build definitions, each with dockcross and qemu.
          e.g. [{"dockcross":"linux-arm64","qemu":"aarch64"},
                {"dockcross":"linux-armv7","qemu":"arm"}]
        required: true
        type: string
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.builds) }}
    name: ${{ matrix.dockcross }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.qemu }}

      - run: make clean

      - run: make cross PLATFORM=${{ matrix.dockcross }} CROSS_GOAL="TARGET=debug"

      - name: Run unit tests under QEMU
        run: ./docker/dockcross-${{ matrix.dockcross }} ./build/debug-${{ matrix.dockcross }}/target/bin/unit_tests

      - run: make cross PLATFORM=${{ matrix.dockcross }} CROSS_GOAL="TARGET=release"

      - run: cp ./docs/release_docs.md build/release-${{ matrix.dockcross }}/target/README.md

      - name: Compress and upload
        uses: ./.github/actions/compress-and-upload
        with:
          folder: ./build/release-${{ matrix.dockcross }}/target
          artifact-name: release-${{ matrix.dockcross }}
