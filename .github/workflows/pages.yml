name: Website

on:
  push:
    branches: [develop]
  workflow_dispatch:

# Pages needs to read the repo and mint an id-token for the deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/website/package-lock.json

      - uses: actions/configure-pages@v5

      - name: Build site
        run: make website-build

      # The site routes in the browser. Pages serves 404.html for unknown
      # paths, so a deep link like /docs/glossary still loads the app.
      - name: Add SPA fallback
        run: cp docs/website/dist/index.html docs/website/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
