name: CI

on:
  push:
  pull_request:

jobs:
  # Native targets
  build-native:
    uses: ./.github/workflows/build-native.yml
    with:
      builds: |
        [
          {"platform": "ubuntu-latest", "goal": "TARGET=release", "folder": "build/release/target"},
          {"platform": "macos-latest", "goal": "TARGET=release", "folder": "build/release/target"}
        ]

  # Dock Cross targets
  build-dockcross:
    uses: ./.github/workflows/build-dockcross.yml
    with:
      builds: |
        [
          {"platform": "linux-arm64", "goal": "TARGET=release", "folder": "build/release-linux-arm64/target"}
        ]
