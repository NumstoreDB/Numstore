name: Release

on:
  push: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
          - os: ubuntu-24.04-arm
            suffix: linux-arm64
          - os: macos-latest
            suffix: macos-arm64
          - os: macos-13
            suffix: macos-x64
          # No Windows runner needed: mingw-w64 running in Docker on Linux
          # cross-compiles the whole project (see docker/windows-x64.Dockerfile),
          # the same approach sqlite-jdbc uses for its native builds.
          - os: ubuntu-latest
            suffix: windows-x64
            cross: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2
        if: matrix.cross != 'windows'
        with:
          pandoc-version: '3.1'

      - uses: actions/setup-python@v5
        if: matrix.cross != 'windows'
        with:
          python-version: '3.12'

      - name: Build release package (Linux/macOS)
        if: matrix.cross != 'windows'
        run: make release-package

      - name: Build release package (Windows, cross-compiled via Docker/mingw-w64)
        if: matrix.cross == 'windows'
        run: |
          docker build -t numstore-win-cross -f docker/windows-x64.Dockerfile docker
          docker run --rm -v "$PWD":/work -w /work numstore-win-cross \
            make CC=x86_64-w64-mingw32-gcc AR=x86_64-w64-mingw32-ar \
                 WINE=wine64 release-package-windows-cross

      - name: Rename artifacts
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p dist
          cp build/release.tar.gz "dist/release-${{ matrix.suffix }}.tar.gz"
          cp build/release.zip   "dist/release-${{ matrix.suffix }}.zip"

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Keep a Changelog format: changelog.py prints the latest release's
      # notes to stdout.
      - name: Extract latest changelog entry
        shell: bash
        run: python3 scripts/changelog.py > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: dist/*
