name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04 }
          - { runner: ubuntu-24.04-arm }
          - { runner: macos-15 }
          - { runner: macos-15-intel }
          - { runner: windows-2025,   msvc_arch: x64 }
          - { runner: windows-11-arm, msvc_arch: arm64 }

    steps:
      - uses: actions/checkout@v4

      # The build links the numstore-rs crate. Hosted runners usually have
      # Rust, but the Windows ARM image doesn't promise it.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Use Ninja on Windows
        if: runner.os == 'Windows'
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - name: Report toolchain
        run: |
          echo "runner:  ${{ matrix.runner }} ($RUNNER_OS/$RUNNER_ARCH)"
          echo "machine: $(uname -m)"
          cmake --version | head -1
          make --version | head -1

      - name: Debug build and unit tests
        run: make test-unit

      - name: Rust tests
        run: cargo test -p numstore-rs

      - name: Python tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test]'
          python -m pytest -ra --tb=short

      - name: Release package
        run: make release-package
